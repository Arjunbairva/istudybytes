<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password | iStudyBytes</title><meta name="description" content="Reset your iStudyBytes account password."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth-polish.css"></head><body class="auth-page"><header class="auth-header"><a href="index.html" class="auth-logo"><img src="images/logo-icon.png" alt="iStudyBytes"><span><span class="brand-dark">iStudy</span><span class="brand-blue">Bytes</span></span></a><a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i><span>Back to Home</span></a></header><main class="auth-main"><div class="login-card"><div class="auth-card-logo"><img src="images/logo-icon.png" alt="iStudyBytes"></div><div class="auth-heading"><h1>Forgot Password?</h1><p>Enter your email and we’ll send you a password reset link.</p></div><div id="auth-message" class="auth-message"></div><form id="forgotPasswordForm"><div class="form-group"><label for="email">Email Address</label><div class="input-wrapper"><i class="fa-regular fa-envelope"></i><input type="email" id="email" autocomplete="email" placeholder="Enter your email" required></div></div><button type="submit" class="auth-submit" id="resetSubmit">Send Reset Link</button></form><div class="auth-divider"><span>OR</span></div><p class="register-text">Remember your password? <a href="login.html">Back to Login</a></p></div></main><footer class="auth-footer">© 2026 iStudyBytes. All rights reserved.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>const form=document.getElementById('forgotPasswordForm'),button=document.getElementById('resetSubmit'),message=document.getElementById('auth-message');function showMessage(text,type){message.textContent=text;message.className='auth-message show '+type}form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;showMessage('Sending reset link…','success');const email=document.getElementById('email').value.trim();const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/reset-password.html'});if(error){showMessage(error.message,'error');button.disabled=false;return}showMessage('If an account exists for this email, a password reset link has been sent. Check your inbox.','success');button.disabled=false});</script></body></html>
