<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | iStudyBytes</title>

    <meta name="description"
          content="Create your iStudyBytes account and start learning smarter.">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="auth-header">

        <a href="index.html" class="auth-logo">

            <img src="images/logo-icon.png"
                 alt="iStudyBytes Logo">

            <span>
                <strong>iStudy</strong><b>Bytes</b>
            </span>

        </a>


        <a href="index.html" class="back-home">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Home

        </a>

    </header>


    <!-- REGISTER -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">

                <img src="images/logo-icon.png"
                     alt="iStudyBytes">

            </div>


            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Start learning smarter with iStudyBytes.
            </p>


            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <i class="fa-regular fa-eye password-toggle"
                           id="togglePassword"></i>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <i class="fa-regular fa-eye password-toggle"
                           id="toggleConfirmPassword"></i>

                    </div>

                </div>


                <!-- TERMS -->

                <div class="terms-box">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">

                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.

                    </label>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="auth-button">

                    Create Account

                </button>


            </form>


            <div class="auth-divider">

                <span>OR</span>

            </div>


            <p class="auth-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script>

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const togglePassword =
            document.getElementById("togglePassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");


        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                this.classList.remove("fa-eye");

                this.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                this.classList.remove("fa-eye-slash");

                this.classList.add("fa-eye");

            }

        });


        toggleConfirmPassword.addEventListener("click", function () {

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";

                this.classList.remove("fa-eye");

                this.classList.add("fa-eye-slash");

            } else {

                confirmPassword.type = "password";

                this.classList.remove("fa-eye-slash");

                this.classList.add("fa-eye");

            }

        });


        document
            .getElementById("registerForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                if (password.value !== confirmPassword.value) {

                    alert("Passwords do not match.");

                    return;

                }

                alert("Registration form submitted.");

            });

    </script>

</body>

</html>
