<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | iStudyBytes</title><meta name="description" content="Create your iStudyBytes account."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth-polish.css"></head><body class="auth-page"><header class="auth-header"><a href="index.html" class="auth-logo"><img src="images/logo-icon.png" alt="iStudyBytes"><span><span class="brand-dark">iStudy</span><span class="brand-blue">Bytes</span></span></a><a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i><span>Back to Home</span></a></header><main class="auth-main"><div class="auth-card"><div class="auth-icon"><img src="images/logo-icon.png" alt="iStudyBytes"></div><h1>Create Account</h1><p class="auth-subtitle">Create your account to access iStudyBytes courses.</p><div id="auth-message" class="auth-message"></div><form id="registerForm"><div class="form-group"><label for="name">Full Name</label><div class="input-box"><i class="fa-regular fa-user"></i><input type="text" id="name" autocomplete="name" placeholder="Enter your name" required></div></div><div class="form-group"><label for="email">Email Address</label><div class="input-box"><i class="fa-regular fa-envelope"></i><input type="email" id="email" autocomplete="email" placeholder="Enter your email" required></div></div><div class="form-group"><label for="password">Password</label><div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="password" autocomplete="new-password" minlength="6" placeholder="Create a password" required><button type="button" class="password-toggle" id="togglePassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div><div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Confirm your password" required><button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div><div class="terms-box"><input type="checkbox" id="terms" required><label for="terms">I agree to the Terms &amp; Conditions and Privacy Policy.</label></div><button type="submit" class="auth-button" id="registerSubmit">Create Account</button></form><div class="auth-divider"><span>OR</span></div><p class="auth-bottom">Already have an account? <a href="login.html">Login</a></p></div></main><footer class="auth-footer">© 2026 iStudyBytes. All rights reserved.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>
const form=document.getElementById('registerForm'),submit=document.getElementById('registerSubmit'),message=document.getElementById('auth-message');function showMessage(text,type){message.textContent=text;message.className='auth-message show '+type}function toggleField(input,button){button.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';button.innerHTML=show?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>'})}toggleField(document.getElementById('password'),document.getElementById('togglePassword'));toggleField(document.getElementById('confirmPassword'),document.getElementById('toggleConfirmPassword'));form.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;if(password!==confirm){showMessage('Passwords do not match.','error');return}submit.disabled=true;showMessage('Creating your account…','success');const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name,name:name}}});if(error){showMessage(error.message,'error');submit.disabled=false;return}if(data.session){window.location.href='dashboard.html'}else{showMessage('Account created. Check your email to confirm your address, then log in.','success');submit.disabled=false;form.reset()}});
</script></body></html>
