<header class="site-header" id="site-header">
  <script>try{for(var k in localStorage){if(/^sb-.+-auth-token$/.test(k)){document.documentElement.classList.add('has-session');break}}}catch(e){}</script>
  <div class="site-header__inner">
    <a href="index.html" class="site-logo" aria-label="iStudyBytes home">
      <img src="images/logo-icon.avif" alt="" width="36" height="36">
      <span class="site-logo__text"><b>iStudy</b><strong>Bytes</strong></span>
    </a>
    <button class="site-menu-toggle" type="button" id="site-menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <svg class="icon-open" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="icon-close" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <ul class="site-nav__links">
        <li><a href="index.html"{{cur:home}}>Home</a></li>
        <li><a href="store.html"{{cur:store}}>Store</a></li>
        <li><a href="ncert-solutions.html"{{cur:ncert}}>NCERT Solutions</a></li>
        <li><a href="quiz.html"{{cur:quiz}}>Quizzes</a></li>
        <li><a href="about.html"{{cur:about}}>About</a></li>
      </ul>
      <div class="site-nav__actions">
        <div class="site-nav__guest">
          <a href="login.html" class="btn btn-ghost btn-sm" id="home-auth-link">Log in</a>
          <a href="register.html" class="btn btn-primary btn-sm">Sign up</a>
        </div>
        <div class="site-user" id="site-user">
          <button type="button" class="site-user__button" id="userButton" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
            <span class="site-user__avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
            <span class="site-user__name" id="site-user-name">Account</span>
            <svg class="site-user__chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="site-user__menu" id="userMenu" role="menu">
            <a href="dashboard.html" role="menuitem">Dashboard</a>
            <a href="store.html" role="menuitem">Store</a>
            <a href="#" id="logout-btn" role="menuitem">Log out</a>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
