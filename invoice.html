<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice | iStudyBytes</title><link rel="icon" href="images/logo-icon.avif">
<meta name="description" content="iStudyBytes payment invoice and receipt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/invoice.css">
</head>
<body class="page-invoice">
<a class="skip-link" href="#main">Skip to main content</a>
<main id="main" class="invoice-shell">
<div class="invoice-actions">
<a class="btn btn-secondary" href="dashboard.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Dashboard</a>
<button class="btn btn-primary" type="button" onclick="window.print()"><i class="fa-solid fa-download" aria-hidden="true"></i> Download / Print Invoice</button>
</div>
<div id="invoice-root" class="invoice-card">
<div class="invoice-state"><p>Loading your invoice...</p></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
(async function(){
const root=document.getElementById('invoice-root');
function showError(title,text){root.innerHTML='<div class="invoice-state"><h2>'+title+'</h2><p>'+text+'</p><a class="btn btn-primary" href="dashboard.html">Go to dashboard</a></div>';}
const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
if(sessionError||!session){window.location.href='login.html';return;}
const orderId=new URLSearchParams(window.location.search).get('order');
if(!orderId||!/^\d+$/.test(orderId)){showError('Invoice not found','The invoice link is invalid or incomplete.');return;}
const {data:order,error:orderError}=await supabaseClient.from('orders').select('id,user_id,total_amount,status,payment_id,created_at,razorpay_order_id,product_type,product_slug,bundle_id,course_id').eq('id',Number(orderId)).eq('user_id',session.user.id).eq('status','paid').maybeSingle();
if(orderError||!order){showError('Invoice unavailable','We could not find a paid order for this account.');return;}
let productName='',productDescription='';
if(order.product_type==='bundle'){
  const {data:bundle,error:bundleError}=await supabaseClient.from('resource_bundles').select('name,description').eq('id',order.bundle_id).maybeSingle();
  if(bundleError||!bundle){showError('Invoice unavailable','The resource bundle linked to this payment could not be found.');return;}
  const {data:access}=await supabaseClient.from('resource_access').select('id').eq('order_id',order.id).eq('user_id',session.user.id).maybeSingle();
  if(!access){showError('Invoice unavailable','Resource access could not be verified for this order.');return;}
  productName=bundle.name;productDescription='One-time digital resource bundle access';
}else{
  const {data:access,error:accessError}=await supabaseClient.from('course_access').select('course_id,granted_at').eq('order_id',order.id).eq('user_id',session.user.id).maybeSingle();
  if(accessError||!access){showError('Invoice unavailable','Course access could not be verified for this order.');return;}
  const {data:course,error:courseError}=await supabaseClient.from('courses').select('name,slug,description,price').eq('id',access.course_id).maybeSingle();
  if(courseError||!course){showError('Invoice unavailable','The course linked to this payment could not be found.');return;}
  productName=course.name;productDescription='One-time digital course access';
}
const customerName=session.user.user_metadata?.full_name||session.user.user_metadata?.name||session.user.email?.split('@')[0]||'Student';
const invoiceNumber='ISB-'+new Date(order.created_at).getFullYear()+'-'+String(order.id).padStart(6,'0');
const invoiceDate=new Date(order.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const amount=Number(order.total_amount).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const safe=(value)=>String(value??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
root.innerHTML=`
<div class="invoice-top"><div><div class="brand"><span class="brand-dark">iStudy</span><span class="brand-blue">Bytes</span><span class="invoice-brand-owner">By Arjun Bairva</span></div><p class="invoice-top__tagline">Digital Education &amp; Learning</p></div><div class="invoice-label"><h1>Invoice</h1><p>${safe(invoiceNumber)}</p></div></div>
<div class="invoice-body">
<div class="meta-grid">
<div><div class="meta-title">Billed To</div><div class="meta-value">${safe(customerName)}</div><div class="meta-muted">${safe(session.user.email)}</div></div>
<div><div class="meta-title">Invoice Details</div><div class="meta-value">Invoice No. ${safe(invoiceNumber)}</div><div class="meta-muted">Date: ${safe(invoiceDate)}</div><div class="meta-badge"><span class="paid-badge"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Paid</span></div></div>
</div>
<table class="items"><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody><tr><td><div class="item-name">${safe(productName)}</div><div class="item-desc">${safe(productDescription)}</div></td><td>₹${amount}</td></tr></tbody></table>
<div class="total-wrap"><table class="total-table"><tbody><tr><td>Subtotal</td><td>₹${amount}</td></tr><tr><td>Tax</td><td>₹0.00</td></tr><tr class="grand"><td>Total Paid</td><td>₹${amount}</td></tr></tbody></table></div>
<div class="invoice-note"><p><strong>Payment reference:</strong> ${safe(order.payment_id)}<br><strong>Razorpay order ID:</strong> ${safe(order.razorpay_order_id)}</p><p>This invoice confirms payment for the digital educational course listed above. Tax/GST details are shown only where applicable.</p></div>
</div>
<div class="invoice-footer">Thank you for choosing iStudyBytes. Please keep this invoice for your records.<span class="owner-line">iStudyBytes • By Arjun Bairva</span></div>`;
})();
</script>
</body>
</html>
