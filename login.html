<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | iStudyBytes</title><meta name="description" content="Login to your iStudyBytes account."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth-polish.css"></head><body class="auth-page"><header class="auth-header"><a href="index.html" class="auth-logo"><img src="images/logo-icon.png" alt="iStudyBytes"><span><span class="brand-dark">iStudy</span><span class="brand-blue">Bytes</span></span></a><a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i><span>Back to Home</span></a></header><main class="auth-main"><div class="login-card"><div class="auth-card-logo"><img src="images/logo-icon.png" alt="iStudyBytes"></div><div class="auth-heading"><h1>Welcome Back</h1><p>Login to continue learning with iStudyBytes.</p></div><div id="auth-message" class="auth-message"></div><form id="login-form"><div class="form-group"><label for="email">Email Address</label><div class="input-wrapper"><i class="fa-regular fa-envelope"></i><input type="email" id="email" autocomplete="email" placeholder="Enter your email" required></div></div><div class="form-group"><div class="password-label"><label for="password">Password</label><a href="forgot-password.html">Forgot Password?</a></div><div class="input-wrapper"><i class="fa-solid fa-lock"></i><input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required><button type="button" class="password-toggle" id="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div><div class="remember-row"><label class="remember-label"><input type="checkbox" id="remember" checked><span>Keep me signed in</span></label></div><button type="submit" class="auth-submit" id="login-submit">Login</button></form><div class="google-login-section"><div class="login-divider"><span>OR</span></div><button type="button" id="google-login" class="google-login-btn"><i class="fa-brands fa-google"></i> Continue with Google</button></div><div class="auth-divider"><span>OR</span></div><p class="register-text">Don't have an account? <a href="register.html">Create an account</a></p></div></main><footer class="auth-footer">© 2026 iStudyBytes. All rights reserved.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>
const form=document.getElementById('login-form'),submit=document.getElementById('login-submit'),message=document.getElementById('auth-message'),password=document.getElementById('password'),toggle=document.getElementById('password-toggle');function showMessage(text,type){message.textContent=text;message.className='auth-message show '+type}toggle.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.innerHTML=show?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>'});form.addEventListener('submit',async e=>{e.preventDefault();showMessage('Signing you in…','success');submit.disabled=true;const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:password.value});if(error){showMessage(error.message,'error');submit.disabled=false;return}window.location.href='dashboard.html'});document.getElementById('google-login').addEventListener('click',async()=>{const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/dashboard.html'}});if(error)showMessage(error.message,'error')});
</script></body></html>
