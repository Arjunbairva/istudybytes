<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Set New Password | iStudyBytes</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth-polish.css"></head><body class="auth-page"><header class="auth-header"><a href="index.html" class="auth-logo"><img src="images/logo-icon.png" alt="iStudyBytes"><span><span class="brand-dark">iStudy</span><span class="brand-blue">Bytes</span></span></a><a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i><span>Back to Home</span></a></header><main class="auth-main"><div class="login-card"><div class="auth-card-logo"><img src="images/logo-icon.png" alt="iStudyBytes"></div><div class="auth-heading"><h1>Set New Password</h1><p>Choose a new password for your iStudyBytes account.</p></div><div id="auth-message" class="auth-message"></div><form id="resetForm"><div class="form-group"><label for="password">New Password</label><div class="input-wrapper"><i class="fa-solid fa-lock"></i><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Enter new password" required><button type="button" class="password-toggle" id="toggle"><i class="fa-regular fa-eye"></i></button></div></div><div class="form-group"><label for="confirm">Confirm Password</label><div class="input-wrapper"><i class="fa-solid fa-lock"></i><input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="Confirm new password" required></div></div><button class="auth-submit" id="submit" type="submit">Update Password</button></form></div></main><footer class="auth-footer">© 2026 iStudyBytes. All rights reserved.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>const message=document.getElementById('auth-message'),form=document.getElementById('resetForm'),submit=document.getElementById('submit'),password=document.getElementById('password'),confirm=document.getElementById('confirm');function showMessage(t,c){message.textContent=t;message.className='auth-message show '+c}document.getElementById('toggle').addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password'});supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&!session)showMessage('This reset link is invalid or expired. Request a new one.','error')});form.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){showMessage('Passwords do not match.','error');return}submit.disabled=true;showMessage('Updating your password…','success');const {error}=await supabaseClient.auth.updateUser({password:password.value});if(error){showMessage(error.message,'error');submit.disabled=false;return}showMessage('Password updated successfully. You can now log in.','success');setTimeout(()=>window.location.href='login.html',1200)});</script></body></html>
